# NATS server for the dispatcher's PR events (agent-config docs/event-broker-design.md, sections 6-7).
# One account per allowed owner, each with its own JetStream, stream GITHUB, receiver and reader
# users. An account cannot see another account's subjects or stream. Public NKeys come from the
# environment (compose's .env on the NAS, CI's generated keys): nothing about the NAS is in this
# file. There is no keyless user: a connection without a key is refused on both ports.
#
# To add an owner: copy one account block below, replace the owner name in the account name and
# the subjects, and replace the owner in the two variable names (upper case, "-" becomes "_");
# add the owner to ALLOWED_OWNERS and to compose.yaml's nats environment; run the setup again.

server_name: event-broker
port: 4222

jetstream {
  store_dir: "/data"
  max_file_store: 1GB
  max_memory_store: 64MB
}

# The cloud dispatcher's path: wss://<nas domain>/nats at the reverse proxy, which ends TLS.
websocket {
  port: 8080
  no_tls: true
}

accounts {
  "kade-k8s-platform": {
    jetstream: enabled
    users: [
      {
        nkey: $RECEIVER_NKEY_KADE_K8S_PLATFORM
        allowed_connection_types: ["STANDARD"]
        permissions: {
          publish: {
            allow: [
              "github.kade-k8s-platform.>",
              "$JS.API.INFO",
              "$JS.API.STREAM.INFO.GITHUB",
              "$JS.API.STREAM.CREATE.GITHUB",
              "$JS.API.STREAM.UPDATE.GITHUB",
              "$JS.API.CONSUMER.INFO.GITHUB.dispatcher",
              "$JS.API.CONSUMER.CREATE.GITHUB.dispatcher",
              "$JS.API.CONSUMER.CREATE.GITHUB.dispatcher.>",
              "$JS.API.CONSUMER.DURABLE.CREATE.GITHUB.dispatcher",
              "$JS.API.CONSUMER.UPDATE.GITHUB.dispatcher"
            ]
          }
          subscribe: { allow: ["_INBOX.>"] }
        }
      }
      {
        nkey: $READER_NKEY_KADE_K8S_PLATFORM
        allowed_connection_types: ["STANDARD", "WEBSOCKET"]
        permissions: {
          publish: {
            allow: [
              "$JS.API.INFO",
              "$JS.API.STREAM.INFO.GITHUB",
              "$JS.API.CONSUMER.INFO.GITHUB.dispatcher",
              "$JS.API.CONSUMER.MSG.NEXT.GITHUB.dispatcher",
              "$JS.ACK.GITHUB.dispatcher.>"
            ]
          }
          subscribe: { allow: ["_INBOX.>"] }
        }
      }
    ]
  }
  "kade-agent": {
    jetstream: enabled
    users: [
      {
        nkey: $RECEIVER_NKEY_KADE_AGENT
        allowed_connection_types: ["STANDARD"]
        permissions: {
          publish: {
            allow: [
              "github.kade-agent.>",
              "$JS.API.INFO",
              "$JS.API.STREAM.INFO.GITHUB",
              "$JS.API.STREAM.CREATE.GITHUB",
              "$JS.API.STREAM.UPDATE.GITHUB",
              "$JS.API.CONSUMER.INFO.GITHUB.dispatcher",
              "$JS.API.CONSUMER.CREATE.GITHUB.dispatcher",
              "$JS.API.CONSUMER.CREATE.GITHUB.dispatcher.>",
              "$JS.API.CONSUMER.DURABLE.CREATE.GITHUB.dispatcher",
              "$JS.API.CONSUMER.UPDATE.GITHUB.dispatcher"
            ]
          }
          subscribe: { allow: ["_INBOX.>"] }
        }
      }
      {
        nkey: $READER_NKEY_KADE_AGENT
        allowed_connection_types: ["STANDARD", "WEBSOCKET"]
        permissions: {
          publish: {
            allow: [
              "$JS.API.INFO",
              "$JS.API.STREAM.INFO.GITHUB",
              "$JS.API.CONSUMER.INFO.GITHUB.dispatcher",
              "$JS.API.CONSUMER.MSG.NEXT.GITHUB.dispatcher",
              "$JS.ACK.GITHUB.dispatcher.>"
            ]
          }
          subscribe: { allow: ["_INBOX.>"] }
        }
      }
    ]
  }
  "stella-rain": {
    jetstream: enabled
    users: [
      {
        nkey: $RECEIVER_NKEY_STELLA_RAIN
        allowed_connection_types: ["STANDARD"]
        permissions: {
          publish: {
            allow: [
              "github.stella-rain.>",
              "$JS.API.INFO",
              "$JS.API.STREAM.INFO.GITHUB",
              "$JS.API.STREAM.CREATE.GITHUB",
              "$JS.API.STREAM.UPDATE.GITHUB",
              "$JS.API.CONSUMER.INFO.GITHUB.dispatcher",
              "$JS.API.CONSUMER.CREATE.GITHUB.dispatcher",
              "$JS.API.CONSUMER.CREATE.GITHUB.dispatcher.>",
              "$JS.API.CONSUMER.DURABLE.CREATE.GITHUB.dispatcher",
              "$JS.API.CONSUMER.UPDATE.GITHUB.dispatcher"
            ]
          }
          subscribe: { allow: ["_INBOX.>"] }
        }
      }
      {
        nkey: $READER_NKEY_STELLA_RAIN
        allowed_connection_types: ["STANDARD", "WEBSOCKET"]
        permissions: {
          publish: {
            allow: [
              "$JS.API.INFO",
              "$JS.API.STREAM.INFO.GITHUB",
              "$JS.API.CONSUMER.INFO.GITHUB.dispatcher",
              "$JS.API.CONSUMER.MSG.NEXT.GITHUB.dispatcher",
              "$JS.ACK.GITHUB.dispatcher.>"
            ]
          }
          subscribe: { allow: ["_INBOX.>"] }
        }
      }
    ]
  }
  "star-resonance": {
    jetstream: enabled
    users: [
      {
        nkey: $RECEIVER_NKEY_STAR_RESONANCE
        allowed_connection_types: ["STANDARD"]
        permissions: {
          publish: {
            allow: [
              "github.star-resonance.>",
              "$JS.API.INFO",
              "$JS.API.STREAM.INFO.GITHUB",
              "$JS.API.STREAM.CREATE.GITHUB",
              "$JS.API.STREAM.UPDATE.GITHUB",
              "$JS.API.CONSUMER.INFO.GITHUB.dispatcher",
              "$JS.API.CONSUMER.CREATE.GITHUB.dispatcher",
              "$JS.API.CONSUMER.CREATE.GITHUB.dispatcher.>",
              "$JS.API.CONSUMER.DURABLE.CREATE.GITHUB.dispatcher",
              "$JS.API.CONSUMER.UPDATE.GITHUB.dispatcher"
            ]
          }
          subscribe: { allow: ["_INBOX.>"] }
        }
      }
      {
        nkey: $READER_NKEY_STAR_RESONANCE
        allowed_connection_types: ["STANDARD", "WEBSOCKET"]
        permissions: {
          publish: {
            allow: [
              "$JS.API.INFO",
              "$JS.API.STREAM.INFO.GITHUB",
              "$JS.API.CONSUMER.INFO.GITHUB.dispatcher",
              "$JS.API.CONSUMER.MSG.NEXT.GITHUB.dispatcher",
              "$JS.ACK.GITHUB.dispatcher.>"
            ]
          }
          subscribe: { allow: ["_INBOX.>"] }
        }
      }
    ]
  }
}
