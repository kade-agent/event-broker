# NATS server for the dispatcher's PR events (agent-config docs/event-broker-design.md, sections 6-7).
# Public NKeys and the unused LAN password come from the environment (compose's .env on the NAS,
# CI's generated keys): nothing about the NAS is in this file.

server_name: event-broker
port: 4222

jetstream {
  store_dir: "/data"
  max_file_store: 1GB
  max_memory_store: 64MB
}

# The cloud dispatcher's path: wss://<nas domain>/nats at the reverse proxy, which ends TLS.
websocket {
  port: 8080
  no_tls: true
}

# A plain connection without credentials is the "lan" user. "lan" may only use STANDARD
# connections, so a websocket connection without credentials is refused.
no_auth_user: lan

authorization {
  READER = {
    publish: {
      allow: [
        "$JS.API.INFO",
        "$JS.API.STREAM.INFO.GITHUB",
        "$JS.API.CONSUMER.INFO.GITHUB.dispatcher",
        "$JS.API.CONSUMER.MSG.NEXT.GITHUB.dispatcher",
        "$JS.ACK.GITHUB.dispatcher.>"
      ]
    }
    subscribe: { allow: ["_INBOX.>"] }
  }
  RECEIVER = {
    publish: {
      allow: [
        "github.>",
        "$JS.API.INFO",
        "$JS.API.STREAM.INFO.GITHUB",
        "$JS.API.STREAM.CREATE.GITHUB",
        "$JS.API.STREAM.UPDATE.GITHUB",
        "$JS.API.CONSUMER.INFO.GITHUB.dispatcher",
        "$JS.API.CONSUMER.CREATE.GITHUB.dispatcher",
        "$JS.API.CONSUMER.CREATE.GITHUB.dispatcher.>",
        "$JS.API.CONSUMER.DURABLE.CREATE.GITHUB.dispatcher"
      ]
    }
    subscribe: { allow: ["_INBOX.>"] }
  }
  users: [
    { user: lan, password: $LAN_UNUSED_PASSWORD, permissions: $READER, allowed_connection_types: ["STANDARD"] }
    { nkey: $RECEIVER_NKEY, permissions: $RECEIVER, allowed_connection_types: ["STANDARD"] }
    { nkey: $CLOUD_NKEY, permissions: $READER, allowed_connection_types: ["WEBSOCKET"] }
  ]
}
