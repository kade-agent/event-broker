# On the NAS (README, "Deploying"): put the App key at secrets/app_private_key.pem, run
# `docker compose run --rm setup` (it writes .env, an NKey pair per owner and the other secrets), fill in APP_ID and
# LAN_ADDRESS in .env, then `docker compose up -d --build`. .env and secrets/ are outside git.
# The NAS reverse proxy ends TLS, one hostname each: the webhook -> 127.0.0.1:8787, NATS websocket ->
# 127.0.0.1:8080. Port 4222 is bound to the NAS's LAN address only; the router never forwards it.
# The settings default to empty so that `setup` can run before .env is complete: until it is,
# nats refuses the empty keys and the receiver says which setting is missing.
services:
  nats:
    image: nats:2.15.1-alpine
    command: ["-c", "/etc/nats/nats-server.conf"]
    restart: unless-stopped
    environment:
      RECEIVER_NKEY_KADE_K8S_PLATFORM: ${RECEIVER_NKEY_KADE_K8S_PLATFORM:-}
      RECEIVER_NKEY_KADE_AGENT: ${RECEIVER_NKEY_KADE_AGENT:-}
      RECEIVER_NKEY_STELLA_RAIN: ${RECEIVER_NKEY_STELLA_RAIN:-}
      RECEIVER_NKEY_STAR_RESONANCE: ${RECEIVER_NKEY_STAR_RESONANCE:-}
      READER_NKEY_KADE_K8S_PLATFORM: ${READER_NKEY_KADE_K8S_PLATFORM:-}
      READER_NKEY_KADE_AGENT: ${READER_NKEY_KADE_AGENT:-}
      READER_NKEY_STELLA_RAIN: ${READER_NKEY_STELLA_RAIN:-}
      READER_NKEY_STAR_RESONANCE: ${READER_NKEY_STAR_RESONANCE:-}
    ports:
      - "${LAN_ADDRESS:-127.0.0.1}:4222:4222"
      - "127.0.0.1:8080:8080"
    volumes:
      - ./nats:/etc/nats:ro
      - nats-data:/data

  receiver:
    build: .
    restart: unless-stopped
    depends_on: [nats]
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      APP_ID: ${APP_ID:-}
      ALLOWED_OWNERS: ${ALLOWED_OWNERS:-}
      NATS_URL: nats://nats:4222
      WEBHOOK_SECRET_FILE: /run/secrets/webhook_secret
      APP_PRIVATE_KEY_FILE: /run/secrets/app_private_key
      NATS_NKEY_SEEDS_FILE: /run/secrets/receiver_seeds
    secrets:
      - webhook_secret
      - app_private_key
      - receiver_seeds

  # One-off: docker compose run --rm setup. Runs as root only to set file owners (scripts/setup.js).
  setup:
    profiles: ["setup"]
    build: .
    user: "0:0"
    working_dir: /work
    volumes:
      - .:/work
    command: ["node", "/app/scripts/setup.js", "/work"]

secrets:
  webhook_secret:
    file: ./secrets/webhook_secret
  app_private_key:
    file: ./secrets/app_private_key.pem
  receiver_seeds:
    file: ./secrets/receiver_seeds

volumes:
  nats-data:
