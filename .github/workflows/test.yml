name: test

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node --test
      - name: The image builds
        run: docker build -t event-broker:ci .
      - name: The setup command works in a fresh folder, and a second run changes nothing
        run: |
          mkdir -p secrets && echo "not a real key" > secrets/app_private_key.pem
          docker compose run --rm setup
          grep -Eq '^RECEIVER_NKEY=U[A-Z2-7]{55}$' .env
          grep -Eq '^CLOUD_NKEY=U[A-Z2-7]{55}$' .env
          test "$(stat -c %u secrets/receiver_nkey_seed)" = 1000
          test "$(stat -c %u secrets/cloud_seed)" = "$(id -u)"
          test "$(stat -c %a secrets/webhook_secret)" = 600
          docker compose run --rm setup | grep -q "Nothing to change"

  integration:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Make throwaway NKeys
        run: |
          r=$(node scripts/nkey.js); c=$(node scripts/nkey.js)
          rs=$(echo "$r" | sed -n 1p); cs=$(echo "$c" | sed -n 1p)
          echo "::add-mask::$rs"; echo "::add-mask::$cs"
          {
            echo "RECEIVER_SEED=$rs"; echo "RECEIVER_NKEY=$(echo "$r" | sed -n 2p)"
            echo "CLOUD_SEED=$cs"; echo "CLOUD_NKEY=$(echo "$c" | sed -n 2p)"
            echo "LAN_UNUSED_PASSWORD=$(node -e 'console.log(require("crypto").randomBytes(24).toString("hex"))')"
          } >> "$GITHUB_ENV"
      - name: Start nats-server with nats/nats-server.conf
        run: |
          docker run -d --name nats -p 4222:4222 -p 8080:8080 \
            -e RECEIVER_NKEY -e CLOUD_NKEY -e LAN_UNUSED_PASSWORD \
            -v "$PWD/nats:/etc/nats:ro" nats:2.15.1-alpine -c /etc/nats/nats-server.conf
          for i in $(seq 30); do
            if docker logs nats 2>&1 | grep -q "Server is ready"; then exit 0; fi
            sleep 1
          done
          docker logs nats; exit 1
      - name: Integration tests
        env:
          NATS_URL: nats://127.0.0.1:4222
          NATS_WS_URL: ws://127.0.0.1:8080
        run: node --test test/integration/*.test.js
      - name: client/install-nats.sh installs the pinned CLI
        run: |
          NATS_CLI_DIR="$RUNNER_TEMP/bin" bash client/install-nats.sh
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: client/watch.sh reads one event on the LAN (no key) and over websocket (seed written at run time)
        run: |
          umask 077; printf '%s\n' "$RECEIVER_SEED" > "$RUNNER_TEMP/receiver.nk"
          pub() { nats --server nats://127.0.0.1:4222 --nkey "$RUNNER_TEMP/receiver.nk" pub "$1" "$2"; }
          export WATCH_PIDFILE="$RUNNER_TEMP/watch.pid"

          pub github.ci.watch.pr.1.pull_request '{"ci":"lan"}'
          got=$(EVENT_BROKER_URL=nats://127.0.0.1:4222 timeout 30 bash client/watch.sh | head -n 1 || true)
          echo "lan: $got"; test "$got" = '{"ci":"lan"}'

          pub github.ci.watch.pr.2.pull_request '{"ci":"cloud"}'
          got=$(EVENT_BROKER_URL=ws://127.0.0.1:8080 EVENT_BROKER_NKEY_FILE="$RUNNER_TEMP/cloud.nk" \
            EVENT_BROKER_CLOUD_SEED="$CLOUD_SEED" timeout 30 bash client/watch.sh | head -n 1 || true)
          echo "cloud: $got"; test "$got" = '{"ci":"cloud"}'
          test "$(stat -c %a "$RUNNER_TEMP/cloud.nk")" = 600
      - name: Server log
        if: always()
        run: docker logs nats
